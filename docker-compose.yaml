# FOR DEVS
# Add the location of tunelog-frontend and tunelog-backend folder location in the build section 
# I didnt wanted to clutter my IDE with frontend and backend code so i created a new folder for them and added location 
# NETWORK : media is my internal docker network for my navidrome, remove it or change it as u need 


services:
  tunelog-backend:
    build: /home/adii/Projects/tunelog-backend/  
    container_name: tunelog-backend
    restart: unless-stopped
    tty: true 
    stdin_open: true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
    - PYTHONUNBUFFERED=1
    - FORCE_COLOR=1
    - TERM=xterm-256color
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "4534:4534"
    networks:
      - default
      - media

  tunelog-frontend:
    build: /home/adii/Projects/tunelog-frontend/
    container_name: tunelog-frontend
    restart: unless-stopped
    tty: true
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - tunelog-backend


networks:
  media:
    external : true
